id: net.cubers.assault.AssaultCube
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: assaultcube
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --persist=.assaultcube
modules:
  - shared-modules/SDL2/SDL2_image.json

  - name: enet
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: assaultcube
    buildsystem: cmake-ninja
    no-make-install: true
    subdir: source/src
    sources:
      - type: git
        url: https://github.com/assaultcube/AC.git
        tag: v1.3.0.2
        commit: 1ece5af7533983bb8f827616381d282470793d90
      - type: file
        path: CMakeLists.txt
      - type: file
        path: net.cubers.assault.AssaultCube.png
      - type: file
        path: net.cubers.assault.AssaultCube.desktop
      - type: shell
        commands:
          - cp CMakeLists.txt -t source/src
          - sed -i 's#CUBE_DIR=$(dirname "$(readlink -f "${0}")")#CUBE_DIR=/app/share/assaultcube/#g' assaultcube.sh
          - sed -i 's|//#define PRODUCTION|#define PRODUCTION|' 'source/src/cube.h'
    post-install:
      - install -Dm755 ../../assaultcube.sh /app/bin/assaultcube
      - install -Dm755 ac_linux /app/share/assaultcube/bin_unix/native_client
      - cp -a ../../bot ../../config ../../mods ../../packages /app/share/assaultcube
      - install -Dm644 ../../net.cubers.assault.AssaultCube.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 ../../net.cubers.assault.AssaultCube.desktop -t /app/share/applications
